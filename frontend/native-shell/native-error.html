<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#071d18" />
  <title>AgriCore offline</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#071d18;color:#fff}
    main{min-height:100%;display:grid;place-items:center;padding:32px;box-sizing:border-box}
    section{max-width:540px;text-align:center}
    h1{font-size:32px;margin:0 0 12px}
    p{color:#c8ddd5;line-height:1.55}
    button{margin-top:18px;border:0;border-radius:12px;padding:12px 18px;font-weight:800;background:#fff;color:#103d2e}
  </style>
</head>
<body>
  <main>
    <section>
      <h1>AgriCore can’t connect</h1>
      <p>Check your internet connection and try again. Any technician data already stored for offline use remains available through AgriCore’s offline workflow when the application loads successfully.</p>
      <button onclick="location.reload()">Try again</button>
    </section>
  </main>
</body>
</html>
